# The Railway deployment (SPRING_PROFILES_ACTIVE=prod).
# Values that differ per deployment, and every secret, come from the service's variables.

# DATABASE: Railway's Postgres service over the private network (PGHOST is its private host, never the TCP proxy)
spring.datasource.url=jdbc:postgresql://${PGHOST}:${PGPORT}/${PGDATABASE}
spring.datasource.username=${PGUSER}
spring.datasource.password=${PGPASSWORD}

# HTTPS ends at Railway's edge, which sets X-Forwarded-Proto and X-Forwarded-For on every public request;
# Railway publishes no address range for its proxies, so every proxy address is trusted
server.forward-headers-strategy=native
server.tomcat.remoteip.internal-proxies=.*
server.servlet.session.cookie.secure=true

# RATE LIMITS: the edge overwrites X-Real-IP with the client's address on every public request
app.rate-limit.client-ip-header=X-Real-IP

# MAIL: Railway's Hobby plan blocks outbound SMTP, so email goes through Resend's HTTPS API (RESEND_API_KEY)
app.mail.transport=resend
