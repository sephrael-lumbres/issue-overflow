# DATABASE
#spring.datasource.url=jdbc:postgresql://localhost:5432/issueoverflow
#spring.datasource.username=${DB_USERNAME}
#spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.format_sql=true
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=30MB
spring.application.name=issue-overflow

# S3 FILE STORAGE
app.s3.bucket=${S3_BUCKET}
app.s3.region=${AWS_REGION}
app.s3.access-key-id=${AWS_ACCESS_KEY_ID}
app.s3.secret-access-key=${AWS_SECRET_ACCESS_KEY}
app.s3.presigned-url-ttl=15m

# MAIL
spring.mail.host=smtppro.zoho.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true