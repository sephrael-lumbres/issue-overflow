# DATABASE
#spring.datasource.url=jdbc:postgresql://localhost:5432/issueoverflow
#spring.datasource.username=${DB_USERNAME}
#spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.format_sql=true
# Forms are validated in the controllers; entity validation stays off so the entities' old @NotNull/@NotEmpty stay inactive.
spring.jpa.properties.jakarta.persistence.validation.mode=none
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=30MB
spring.application.name=issue-overflow

# S3 FILE STORAGE
app.s3.bucket=${S3_BUCKET}
app.s3.region=${AWS_REGION}
app.s3.access-key-id=${AWS_ACCESS_KEY_ID}
app.s3.secret-access-key=${AWS_SECRET_ACCESS_KEY}
app.s3.presigned-url-ttl=15m

# PUBLIC ADDRESS, used to build the links in emails (for example http://localhost:8080)
app.base-url=${APP_BASE_URL}

# ACCOUNT LINKS: how long password reset and email verification links work
app.password-reset-ttl=1h
app.email-verification-ttl=24h

# MAIL
# Emails go out on a background thread after the request (app.mail.async).
# Set APP_MAIL_ENABLED=false to log emails instead of sending them, for a deployment without a mail provider.
app.mail.enabled=true
app.mail.async=true
# Give up on a mail server that doesn't answer (Jakarta Mail waits forever by default)
spring.mail.properties.mail.smtp.connectiontimeout=10000
spring.mail.properties.mail.smtp.timeout=10000
spring.mail.properties.mail.smtp.writetimeout=10000
# Background emails run on Spring Boot's applicationTaskExecutor: 8 threads and a bounded queue (a full queue drops
# the email with a WARN), and on shutdown it waits up to 15 seconds for queued emails.
# The force mode keeps the executor even if a later change defines its own Executor bean.
spring.task.execution.pool.max-size=8
spring.task.execution.pool.queue-capacity=500
spring.task.execution.shutdown.await-termination=true
spring.task.execution.shutdown.await-termination-period=15s
spring.task.execution.mode=force
spring.mail.host=smtppro.zoho.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
